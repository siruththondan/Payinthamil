name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 130, Chrome 128, ...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 24.04, Windows 11, macOS 14, ...
    validations:
      required: true
  - type: textarea
    id: keyboard
    attributes:
      label: Keyboard layout setup
      description: Which OS keyboard layout is active (for example US QWERTY), and do you have a Tamil99 input method installed?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Practice tab
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Open the browser developer tools, Console tab, and paste any errors.
      render: text
